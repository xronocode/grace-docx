<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">GRACE-DOCX v1 to v3 transition</title>
  <desc id="desc">v1 maps document sections. v3 maps sections and typed elements inside them.</desc>
  <rect width="1200" height="620" fill="#fbfbfc"/>
  <text x="72" y="86" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#172033">From section-aware to element-aware</text>

  <rect x="72" y="142" width="456" height="360" rx="16" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="112" y="194" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">v1</text>
  <text x="112" y="228" font-family="Inter, Arial, sans-serif" font-size="18" fill="#526076">Find the right section</text>
  <rect x="112" y="270" width="336" height="154" rx="10" fill="#eef2f7"/>
  <text x="138" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#233044">&lt;M-PROC TYPE="CONTENT"&gt;</text>
  <text x="138" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#233044">  PARA-START 120</text>
  <text x="138" y="371" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#233044">  PARA-END   248</text>
  <text x="138" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#233044">  TABLE-COUNT 2</text>

  <path d="M558 322 H640" stroke="#58708f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="672" y="142" width="456" height="360" rx="16" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="712" y="194" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">v3</text>
  <text x="712" y="228" font-family="Inter, Arial, sans-serif" font-size="18" fill="#526076">Find the section and understand its objects</text>
  <rect x="712" y="270" width="350" height="176" rx="10" fill="#132238"/>
  <text x="738" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e8edf5">&lt;ELEMENTS&gt;</text>
  <text x="738" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#80d8c8">TABLE-DATA rows=12 columns=4</text>
  <text x="738" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#ffd071">CHART-NATIVE source=chart1.xml</text>
  <text x="738" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f2a8a8">VISUAL-IMAGE readonly=true</text>
  <text x="738" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e8edf5">&lt;/ELEMENTS&gt;</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58708f"/>
    </marker>
  </defs>
</svg>

