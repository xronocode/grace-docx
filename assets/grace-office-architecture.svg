<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">GRACE Office modules</title>
  <desc id="desc">GRACE Office is a shared protocol with separate DOCX and PPTX adapters. PPTX is additional functionality, not a replacement for DOCX.</desc>
  <rect width="1200" height="640" fill="#f7f8fb"/>
  <rect x="54" y="54" width="1092" height="532" rx="20" fill="#ffffff" stroke="#d9dee8" stroke-width="2"/>

  <text x="92" y="116" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">GRACE Office</text>
  <text x="92" y="154" font-family="Inter, Arial, sans-serif" font-size="19" fill="#526076">One embedded protocol, separate format adapters</text>

  <rect x="392" y="198" width="416" height="244" rx="18" fill="#132238"/>
  <text x="600" y="246" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">GRACE Protocol</text>
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#e8edf5">
    <text x="462" y="304">manifest</text>
    <text x="462" y="342">graph</text>
    <text x="462" y="380">contracts</text>
    <text x="636" y="304">instructions</text>
    <text x="636" y="342">verification</text>
    <text x="636" y="380">typed inventory</text>
  </g>
  <g fill="#58b8a5">
    <circle cx="440" cy="298" r="7"/>
    <circle cx="440" cy="336" r="7"/>
    <circle cx="440" cy="374" r="7"/>
    <circle cx="614" cy="298" r="7"/>
    <circle cx="614" cy="336" r="7"/>
    <circle cx="614" cy="374" r="7"/>
  </g>

  <rect x="92" y="224" width="250" height="192" rx="14" fill="#eef4ff" stroke="#b8cbe4"/>
  <text x="124" y="268" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">GRACE-DOCX</text>
  <text x="124" y="298" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#426187">stable v3</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#39465a">
    <text x="124" y="338">Word adapter</text>
    <text x="124" y="368">sections + elements</text>
  </g>

  <rect x="858" y="224" width="250" height="192" rx="14" fill="#fff4e4" stroke="#e6bf7d"/>
  <text x="890" y="268" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">GRACE-PPTX</text>
  <text x="890" y="298" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#8a5919">preview add-on</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#39465a">
    <text x="890" y="338">PowerPoint adapter</text>
    <text x="890" y="368">slides + shapes</text>
  </g>

  <path d="M342 320 H382" stroke="#58708f" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M818 320 H858" stroke="#bf7a22" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <text x="600" y="506" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#526076">PPTX support is additional functionality beside DOCX, not a migration path.</text>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58708f"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#bf7a22"/>
    </marker>
  </defs>
</svg>
